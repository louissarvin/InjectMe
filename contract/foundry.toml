[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

[rpc_endpoints]
0g_mainnet = "https://evmrpc.0g.ai"

[etherscan]
0g_mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://chainscan.0g.ai/open/api", chain = 16661 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
